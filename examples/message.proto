syntax = "proto3";

package examples;

// A simple message representing a user.
message User {
    int32 id = 1;
    string name = 2;
    string email = 3;
    repeated string tags = 4;
    bool is_active = 5;
}

// A message representing a request to create a user.
message CreateUserRequest {
    User user = 1;
}

// A message representing a response after creating a user.
message CreateUserResponse {
    User user = 1;
    string message = 2;
}